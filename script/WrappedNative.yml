# Wrapped Native Token — Canonical ERC-20 Addresses (EVM mainnets and testnets)
#
# Sources:
#   Uniswap SDK:  https://github.com/Uniswap/sdks/blob/main/sdks/sdk-core/src/entities/weth9.ts
#   ethereum-lists/chains: https://github.com/ethereum-lists/chains
#   Plus per-chain official docs (cited inline where non-obvious).
#
# Chain ID → canonical ERC-20 wrapper for the chain's native gas token
# (WETH on Ethereum, WBNB on BSC, WPOL on Polygon, WAVAX on Avalanche,
# WHYPE on HyperEVM, WMON on Monad, WXDC on XDC, wS on Sonic, etc.).
# Bridged variants from other chains (e.g. Wormhole-WBNB on Ethereum) are
# NOT included.
#
# OP Stack chains share the predeploy 0x4200000000000000000000000000000000000006
# for WETH — that's a protocol convention, not a coincidence. Morph similarly
# uses the predeploy 0x5300000000000000000000000000000000000011.
#
# Special cases:
#   - Celo (42220, 11142220): the native CELO token is itself ERC-20-conformant
#     at the address below — no separate "wrapped" contract is needed.
#   - Codex (81224): stablecoin-native L2; gas paid in USDC rather than ETH,
#     so there is no canonical "wrapped native" in the WETH9 sense. Omitted.
#
# Addresses are quoted so YAML serializers don't mangle them.

